<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora-js</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>
    <div class="calculadora">
    <h1>Calculadora</h1>
    <div class="visor">
        <h1>0</h1>
    </div>

    <div class="card-body">
        <div class="row">
          <div class="col">
            <button id="bt-7" type="button" class="button-text">7</button>
          </div>
          <div class="col">
            <button id="bt-8" type="button" class="button-text">8</button>
          </div>
          <div class="col">
            <button id="bt-9" type="button" class="button-text">9</button>
          </div>
          <div class="col">
            <button id="bt-div" type="button" class="button-text">
              <i class="fa fa-divide"></i>
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <button id="bt-4" type="button" class="button-text">4</button>
          </div>
          <div class="col">
            <button id="bt-5" type="button" class="button-text">5</button>
          </div>
          <div class="col">
            <button id="bt-6" type="button" class="button-text">6</button>
          </div>
          <div class="col">
            <button id="bt-multi" type="button" class="button-text">
              <i class="fa fa-times"></i>
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col">
            <button id="bt-1" type="button" class="button-text">1</button>
          </div>
          <div class="col">
            <button id="bt-2" type="button" class="button-text">2</button>
          </div>
          <div class="col">
            <button id="bt-3" type="button" class="button-text">3</button>
          </div>
          <div class="col">
            <button id="bt-menos" type="button" class="button-text">
              <i class="fa fa-minus"></i>
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col-6">
            <button id="bt-0" type="button" class="button-text">0</button>
          </div>
          <div class="col">
            <button id="bt-vir" type="button" class="button-text">,</button>
          </div>
          <div class="col">
            <button id="bt-mais" type="button" class="button-text">
              <i class="fa fa-plus"></i>
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col offset-6">
            <button id="bt-ac" type="button" class="button-text">AC</button>
          </div>
          <div class="col">
            <button id="bt-equals" type="button" class="button-text">
              <i class="fa fa-equals"></i>
            </button>
          </div>
        </div>
      </div>
      

</body>
</html>
